name: Merged to Main
on:
  pull_request:
    types: [ closed ]
    branches: [ 'main' ]

permissions:
  contents: read

jobs:
  MergedtoMain:
    if: github.event.pull_request.merged == true
    name: Merged to Main
    runs-on: ubuntu-latest
    permissions:
      # write permission is required to create a github release
      contents: write
      pull-requests: write
    steps:
      - name: Update Release Draft
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          commitish: main
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
